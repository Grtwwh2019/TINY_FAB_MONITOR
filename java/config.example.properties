# Oracle 连接
oracle.host=127.0.0.1
oracle.port=1521
oracle.service_name=ORCL
oracle.username=your_username
oracle.password=your_password
# 如果填写此项，将优先从 Windows 环境变量读取密码
oracle.password_env=
oracle.connect_timeout_seconds=15

# 表名支持 TABLE 或 SCHEMA.TABLE
tables.schedule=YOUR_SCHEDULE_TABLE
tables.level_desc=YOUR_LEVEL_DESCRIPTION_TABLE
tables.fab_plan=YOUR_FAB_PLAN_TABLE
tables.fab_dependency=YOUR_FAB_DEPENDENCY_TABLE

# 监控参数
monitor.process_date=20251231
monitor.poll_interval_minutes=5
# DAG 页面启动时的默认层数；界面允许临时输入 0–15
monitor.dag_upstream_levels=5
monitor.dag_downstream_levels=5

# 相对于 JAR 所在目录；历史、当天状态和异常都会保留
storage.directory=data
