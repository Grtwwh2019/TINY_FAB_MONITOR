# Oracle 连接
oracle.host=127.0.0.1
oracle.port=1521
oracle.service_name=ORCL
oracle.username=your_username
oracle.password=your_password
# 如果填写此项，将优先从 Windows 环境变量读取密码
oracle.password_env=
oracle.connect_timeout_seconds=15

# 表名支持 TABLE 或 SCHEMA.TABLE
tables.schedule=IATFSC_FABSCHD
tables.level_desc=IATLVL_LEVEL_DESC
tables.fab_plan=IATCFB_FABPLAN
tables.fab_dependency=IATCFB_FABDEPN

# 监控参数
monitor.process_date=20251231
monitor.poll_interval_minutes=5
monitor.level_min=41
monitor.level_max=69

# 相对于 JAR 所在目录；历史、当天状态和异常都会保留
storage.directory=data
